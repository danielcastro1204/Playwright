name: Pruebas de aceptación

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:
    inputs:
      testTag:
        description: 'Tag a ejecutar (ej: @acceptanceTest o @Issue-2)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  pruebas-aceptacion:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      # Manual con tag escrito: usa ese tag. Push, PR o campo vacío: @acceptanceTest
      TAG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.testTag) || '@acceptanceTest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            pruebas/package-lock.json

      - name: Instalar dependencias de la app
        working-directory: app
        run: npm ci

      - name: Instalar dependencias de las pruebas
        working-directory: pruebas
        run: npm ci

      - name: Instalar Chromium
        working-directory: pruebas
        run: npx playwright install --with-deps chromium

      - name: Levantar la aplicación
        working-directory: app
        env:
          PORT: 3000
        # & la deja corriendo en segundo plano mientras siguen los demás pasos
        run: nohup npm start > app.log 2>&1 &

      - name: Esperar a que la aplicación responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "La aplicación respondió en el intento $i"
              exit 0
            fi
            sleep 1
          done
          echo "La aplicación no respondió en 30 segundos"
          cat app/app.log
          exit 1

      # Sin continue-on-error: si una prueba falla, este paso falla y el job queda en rojo
      - name: Ejecutar pruebas de aceptación
        id: test_execution
        working-directory: pruebas
        # \b evita que @Issue-1 también ejecute @Issue-10
        run: npx playwright test --grep "${TAG}\b"

      - name: Subir el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pruebas/playwright-report
          if-no-files-found: ignore

      - name: Update GitHub Issue with test results
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TEST_RESULT: ${{ steps.test_execution.outcome == 'success' && 'passed' || 'failed' }}
        run: |
          if [[ "$TAG" =~ Issue-([0-9]+) ]]; then
            ISSUE="${BASH_REMATCH[1]}"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh label create "status:passed" --color 0E8A16 --force
            gh label create "status:failed" --color D93F0B --force
            gh issue edit "$ISSUE" --remove-label "status:passed" --remove-label "status:failed" || true
            gh issue edit "$ISSUE" --add-label "status:$TEST_RESULT"
            gh issue comment "$ISSUE" --body "Ejecución **$TEST_RESULT** para \`$TAG\`: $RUN_URL"
          else
            echo "El tag no es de tipo Issue-X, no se actualiza ningún Issue."
          fi